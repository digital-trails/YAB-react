name: YAB Agent Dispatch

on:
  issues:
    types: [labeled]

permissions:
  id-token: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: yab-agent-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch-agent:
    name: Dispatch YAB Agent
    if: >
      github.event.label.name == 'ui-design-agent' ||
      github.event.label.name == 'backup-agent'

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dispatcher dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "azure-ai-projects>=2.1.0" azure-identity PyGithub

      - name: Dispatch and monitor Foundry agent
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_YAB_UI_AGENT_NAME: ${{ secrets.FOUNDRY_YAB_UI_AGENT_NAME }}
          FOUNDRY_YAB_BACKEND_AGENT_NAME: ${{ secrets.FOUNDRY_YAB_BACKEND_AGENT_NAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_BASE_BRANCH: ${{ vars.AGENT_BASE_BRANCH }}
          AGENT_REPO_FULL_NAME: digital-trails/YAB-react
        run: |
          python scripts/dispatch_yab_agent.py

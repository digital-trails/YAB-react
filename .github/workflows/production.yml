name: Production — OTA update (manual)

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Update message shown in the EAS dashboard"
        required: true
        type: string

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Verify a matching production build exists (fingerprint gate)
        run: |
          for P in ios android; do
            CURRENT=$(eas fingerprint:generate --platform "$P" --build-profile production --non-interactive --json | jq -r '.hash')
            LAST=$(eas build:list --channel production --platform "$P" --status finished --limit 1 --non-interactive --json | jq -r '.[0].fingerprint.hash // empty')
            echo "[$P] current=$CURRENT last=${LAST:-<none>}"
            if [ -z "$LAST" ] || [ "$CURRENT" != "$LAST" ]; then
              echo "::error::Native fingerprint for $P differs from the latest production build. An OTA update would not reach users — cut a native release (Release to App Store Connect / Google Play) instead."
              exit 1
            fi
          done

      - name: Publish OTA update to production
        env:
          MSG: ${{ inputs.message }}
        run: eas update --branch production --message "$MSG" --environment production --non-interactive

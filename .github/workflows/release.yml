name: Release — build or OTA (release/** = staging, main = production)

on:
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:
    inputs:
      message:
        description: "OTA message (used only when there is no native change)"
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Resolve target lane (release/** -> staging, main -> production)
        id: target
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "profile=production" >> "$GITHUB_OUTPUT"
            echo "channel=production" >> "$GITHUB_OUTPUT"
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "lane=production" >> "$GITHUB_OUTPUT"
          else
            echo "profile=staging" >> "$GITHUB_OUTPUT"
            echo "channel=staging" >> "$GITHUB_OUTPUT"
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "lane=staging (testing)" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect native change (fingerprint gate)
        id: gate
        env:
          PROFILE: ${{ steps.target.outputs.profile }}
          CHANNEL: ${{ steps.target.outputs.channel }}
        run: |
          CHANGED=false
          {
            echo "### Fingerprint check — ${{ steps.target.outputs.lane }} lane"
            echo ""
            echo "| Platform | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for P in ios android; do
            CURRENT=$(eas fingerprint:generate --platform "$P" --build-profile "$PROFILE" --non-interactive --json | jq -r '.hash')
            LAST=$(eas build:list --channel "$CHANNEL" --platform "$P" --status finished --limit 1 --non-interactive --json | jq -r '.[0].fingerprint.hash // empty')
            echo "[$P] current=$CURRENT last=${LAST:-<none>}"
            if [ -z "$LAST" ] || [ "$CURRENT" != "$LAST" ]; then
              CHANGED=true
              echo "| $P | native changed -> new build needed |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $P | unchanged -> OTA-eligible |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "native_changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Build + submit to testing lanes (native change)
        if: steps.gate.outputs.native_changed == 'true'
        env:
          PROFILE: ${{ steps.target.outputs.profile }}
        run: |
          eas build --profile "$PROFILE" --platform all --auto-submit --non-interactive --no-wait
          {
            echo ""
            echo "## Build queued -> testing lanes (${{ steps.target.outputs.lane }})"
            echo "A native change was detected, so a new binary is building on EAS and will auto-upload to TestFlight (iOS) + Play internal (Android)."
            if [ "${{ steps.target.outputs.profile }}" = "production" ]; then
              echo ""
              echo "### This is a production release — promote the SAME binary once tested"
              echo "- **iOS**: App Store Connect -> release the tested TestFlight build to the App Store."
              echo "- **Android**: Play Console -> promote the tested build from internal -> Production."
            else
              echo ""
              echo "Staging: testers validate it in TestFlight / Play internal. No store promotion."
            fi
            echo ""
            echo "Build status: https://expo.dev/accounts/uva-map-lab/projects/yab/builds"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish OTA update (no native change)
        if: steps.gate.outputs.native_changed == 'false'
        env:
          BRANCH: ${{ steps.target.outputs.channel }}
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          MSG: ${{ inputs.message || github.event.head_commit.message || github.sha }}
        run: |
          eas update --branch "$BRANCH" --environment "$ENVIRONMENT" --message "$MSG" --non-interactive
          {
            echo ""
            echo "## OTA update published -> ${{ steps.target.outputs.lane }} lane"
            echo "JS-only change on branch \`$BRANCH\` — recipients get it on next app launch. No store action required."
          } >> "$GITHUB_STEP_SUMMARY"

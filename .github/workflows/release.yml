name: Release — production (build-once)

on:
  release:
    types: [prereleased, released]
  workflow_dispatch:
    inputs:
      message:
        description: "OTA message (used only when there is no native change)"
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Detect native change (fingerprint gate)
        id: gate
        run: |
          CHANGED=false
          {
            echo "### Fingerprint check (production)"
            echo ""
            echo "| Platform | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for P in ios android; do
            CURRENT=$(eas fingerprint:generate --platform "$P" --build-profile production --non-interactive --json | jq -r '.hash')
            LAST=$(eas build:list --channel production --platform "$P" --status finished --limit 1 --non-interactive --json | jq -r '.[0].fingerprint.hash // empty')
            echo "[$P] current=$CURRENT last=${LAST:-<none>}"
            if [ -z "$LAST" ] || [ "$CURRENT" != "$LAST" ]; then
              CHANGED=true
              echo "| $P | native changed -> new binary needed |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $P | unchanged -> OTA-eligible |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "native_changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Publish OTA update to production (JS-only change)
        if: steps.gate.outputs.native_changed == 'false'
        env:
          MSG: ${{ inputs.message || github.event.release.name || github.event.release.tag_name || github.sha }}
        run: |
          eas update --branch production --message "$MSG" --environment production --non-interactive
          {
            echo ""
            echo "## OTA update published to production"
            echo "JS-only change — no store action required. Users on the current build receive it on next launch."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build release candidate + submit to test tracks (native change)
        if: steps.gate.outputs.native_changed == 'true'
        run: |
          eas build --profile production --platform all --auto-submit --non-interactive --no-wait
          {
            echo ""
            echo "## Release candidate queued (build-once)"
            echo "A native change was detected, so a new binary is building on EAS and will auto-upload to the test tracks (iOS -> TestFlight, Android -> Play internal)."
            echo ""
            echo "### Build-once flow — promote the SAME binary, do not rebuild"
            echo "1. Test the uploaded build in TestFlight / Play internal."
            echo "2. When approved, promote that exact build:"
            echo "   - **iOS**: App Store Connect -> release the tested TestFlight build to the App Store."
            echo "   - **Android**: Play Console -> promote the tested build from the internal track to Production."
            echo ""
            echo "Build status: https://expo.dev/accounts/uva-map-lab/projects/yab/builds"
          } >> "$GITHUB_STEP_SUMMARY"

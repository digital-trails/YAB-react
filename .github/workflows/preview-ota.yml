name: Preview OTA — internal testing

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Detect native change (fingerprint gate)
        id: gate
        run: |
          CHANGED=false
          {
            echo "### Fingerprint check (preview)"
            echo ""
            echo "| Platform | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for P in ios android; do
            CURRENT=$(eas fingerprint:generate --platform "$P" --build-profile preview --non-interactive --json | jq -r '.hash')
            LAST=$(eas build:list --channel preview --platform "$P" --status finished --limit 1 --non-interactive --json | jq -r '.[0].fingerprint.hash // empty')
            echo "[$P] current=$CURRENT last=${LAST:-<none>}"
            if [ -z "$LAST" ] || [ "$CURRENT" != "$LAST" ]; then
              CHANGED=true
              echo "| $P | native changed -> new preview build needed |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $P | unchanged -> OTA-eligible |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "native_changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Publish OTA update to preview (JS-only change)
        if: steps.gate.outputs.native_changed == 'false'
        env:
          MSG: ${{ github.event.head_commit.message || github.sha }}
        run: |
          eas update --branch preview --message "$MSG" --environment preview --non-interactive
          {
            echo ""
            echo "## Preview OTA published"
            echo "JS-only change — internal testers on the preview build get it on next launch."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build internal preview client (native change)
        if: steps.gate.outputs.native_changed == 'true'
        run: |
          eas build --profile preview --platform all --non-interactive --no-wait
          {
            echo ""
            echo "## Internal preview build queued"
            echo "A native change was detected — a new internal-distribution build is building on EAS. Share the EAS install link with testers; no store submission for the preview lane."
            echo ""
            echo "Build status: https://expo.dev/accounts/uva-map-lab/projects/yab/builds"
          } >> "$GITHUB_STEP_SUMMARY"

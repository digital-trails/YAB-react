name: Staging — OTA or TestFlight build

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Detect native change (fingerprint gate)
        id: gate
        run: |
          CURRENT=$(eas fingerprint:generate --platform ios --build-profile staging --non-interactive --json | jq -r '.hash')
          LAST=$(eas build:list --channel staging --platform ios --status finished --limit 1 --non-interactive --json | jq -r '.[0].fingerprint.hash // empty')
          echo "Current fingerprint: $CURRENT"
          echo "Last staging build:  ${LAST:-<none>}"
          if [ -z "$LAST" ] || [ "$CURRENT" != "$LAST" ]; then
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "native_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish OTA update to staging (JS-only change)
        if: steps.gate.outputs.native_changed == 'false'
        env:
          MSG: ${{ github.event.head_commit.message || github.sha }}
        run: eas update --branch staging --message "$MSG" --environment preview --non-interactive

      - name: Build + submit to TestFlight (native change)
        if: steps.gate.outputs.native_changed == 'true'
        run: eas build --profile staging --platform ios --auto-submit --non-interactive --no-wait

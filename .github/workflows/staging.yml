name: Staging — OTA or TestFlight build

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Detect native change (fingerprint gate)
        id: gate
        run: |
          CHANGED=false
          {
            echo "### Fingerprint check (staging)"
            echo ""
            echo "| Platform | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for P in ios android; do
            CURRENT=$(eas fingerprint:generate --platform "$P" --build-profile staging --non-interactive --json | jq -r '.hash')
            LAST=$(eas build:list --channel staging --platform "$P" --status finished --limit 1 --non-interactive --json | jq -r '.[0].fingerprint.hash // empty')
            echo "[$P] current=$CURRENT last=${LAST:-<none>}"
            if [ -z "$LAST" ] || [ "$CURRENT" != "$LAST" ]; then
              CHANGED=true
              echo "| $P | native changed -> new build needed |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $P | unchanged -> OTA-eligible |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "native_changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Publish OTA update to staging (JS-only change)
        if: steps.gate.outputs.native_changed == 'false'
        env:
          MSG: ${{ github.event.head_commit.message || github.sha }}
        run: |
          eas update --branch staging --message "$MSG" --environment preview --non-interactive
          {
            echo ""
            echo "## OTA update published to staging"
            echo "JS-only change — testers on the current TestFlight / Play internal build get it on next launch. No store action needed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build + submit to TestFlight and Play internal (native change)
        if: steps.gate.outputs.native_changed == 'true'
        run: |
          eas build --profile staging --platform all --auto-submit --non-interactive --no-wait
          {
            echo ""
            echo "## Native build queued for staging"
            echo "A native change was detected — new builds are building on EAS and will auto-upload to TestFlight (iOS) and Play internal (Android). Testers install the new build directly; no production store release needed for staging."
          } >> "$GITHUB_STEP_SUMMARY"
